# Desarrollo local con Docker (contexto = raíz del repo, mismos Dockerfiles que Railway)
# Uso: docker compose up --build
# Opcional: crear backend/.env y frontend/.env.local y descomentar env_file en cada servicio.

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    command: /app/scripts/start.sh
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./poly_liquidity.db}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
